<h2>Crear Nueva Tarea</h2>

<form (ngSubmit)="crearTarea()">
  <input [(ngModel)]="form.titulo" name="titulo" placeholder="Título" required />
  <br />
  <input [(ngModel)]="form.descripcion" name="descripcion" placeholder="Descripción" required />
  <br />
  <select [(ngModel)]="form.prioridad" name="prioridad">
    <option value="alta">Alta</option>
    <option value="media">Media</option>
    <option value="baja">Baja</option>
  </select>
  <br />
  <input type="date" [(ngModel)]="form.fechaVencimiento" name="fechaVencimiento" required />
  <br /><br />
  <button type="submit">Crear</button>
</form>
